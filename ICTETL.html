<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT Equipment Tracking Log — NRCP</title>
<style>
  /* ── NRCP brand palette ──
     Navy blue  #0d3472  (primary — from logo shield)
     Gold       #d4a017  (accent  — laurel/sun rays)
     Red        #c0272d  (accent2 — Philippine flag stripe)
     Light bg   #f5f7fb
  */
  :root {
    --navy:        #0d3472;
    --navy-mid:    #154a9e;
    --navy-dark:   #091f47;
    --gold:        #d4a017;
    --gold-light:  #f5e6b0;
    --red:         #c0272d;
    --border:      #d3daea;
    --bg:          #f5f7fb;
    --card-bg:     #ffffff;
    --text:        #12213a;
    --muted:       #526075;
    --ok:          #1f7a3a;
    --ok-bg:       #e3f5e9;
    --pending:     #9a5a00;
    --pending-bg:  #fef3da;
    --shadow:      rgba(13,52,114,.10);
  }
  [data-theme="dark"] {
    --navy:        #3a6bbf;
    --navy-mid:    #2a54a0;
    --navy-dark:   #1a3468;
    --gold:        #e8b830;
    --gold-light:  #3d2e00;
    --red:         #e04040;
    --border:      #243352;
    --bg:          #0d1522;
    --card-bg:     #141f30;
    --text:        #dde5f2;
    --muted:       #7d92b3;
    --ok:          #3ab85a;
    --ok-bg:       #0e2b18;
    --pending:     #d4920a;
    --pending-bg:  #2d1e00;
    --shadow:      rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: background .25s, color .25s;
  }

  /* ── header ── */
  header {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-mid) 100%);
    color: #fff;
    padding: 0 24px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 0;
    border-bottom: 3px solid var(--gold);
  }
  .header-inner {
    max-width: 1140px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding-bottom: 14px;
  }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .nrcp-badge {
    width: 48px; height: 48px; flex-shrink: 0;
    background: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px rgba(255,255,255,.25);
    overflow: hidden;
  }
  .nrcp-badge img { width: 100%; height: 100%; object-fit: contain; }
  .header-title h1 { font-size: 1.2rem; letter-spacing: .2px; font-weight: 700; line-height: 1.2; }
  .header-title p  { font-size: .78rem; opacity: .82; margin-top: 2px; }
  .gold-tag {
    display: inline-block; background: var(--gold); color: var(--navy-dark);
    font-size: .62rem; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; margin-top: 4px;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-header {
    background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 7px; padding: 7px 13px; font-size: .78rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px;
    transition: background .15s;
  }
  .btn-header:hover { background: rgba(255,255,255,.22); }
  /* gold ring on toggle btn */
  #themeToggle { border-color: rgba(212,160,23,.6); }
  #themeToggle:hover { background: rgba(212,160,23,.18); }

  /* ── gold accent bar below header ── */
  .accent-bar {
    height: 4px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--red) 50%, var(--gold) 100%);
  }

  main { max-width: 1140px; margin: 0 auto; padding: 22px 16px 70px; }

  /* ── cards ── */
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: background .25s, border-color .25s;
  }
  .card-title {
    font-size: .95rem; font-weight: 700; color: var(--navy);
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 2px solid var(--gold);
    display: flex; align-items: center; gap: 8px;
  }
  [data-theme="dark"] .card-title { color: var(--gold); }
  .card-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0;
  }

  /* ── form ── */
  form.new-entry {
    display: grid;
    grid-template-columns: 70px 1.7fr 1fr 1.2fr auto;
    gap: 12px; align-items: end;
  }
  @media (max-width: 800px) { form.new-entry { grid-template-columns: 1fr 1fr; } }

  label {
    display: block; font-size: .68rem; font-weight: 700; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px;
  }
  input, select {
    width: 100%; padding: 9px 11px;
    border: 1.5px solid var(--border); border-radius: 7px;
    font-size: .9rem; background: var(--card-bg); color: var(--text);
    transition: border-color .15s, background .25s, color .25s;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,160,23,.18);
  }

  /* ── buttons ── */
  button { cursor: pointer; border: none; border-radius: 7px; padding: 10px 16px;
    font-size: .85rem; font-weight: 700; transition: filter .15s, transform .08s; }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-return { background: var(--ok); color: #fff; }
  .btn-return:hover { filter: brightness(1.15); }
  .btn-gold { background: var(--gold); color: var(--navy-dark); }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(120,140,180,.1); }

  /* ── toolbar ── */
  .toolbar {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .toolbar-left  { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-group  { display: flex; flex-direction: column; gap: 4px; }
  .filter-group select { padding: 8px 10px; min-width: 165px; }
  .hint { font-size: .76rem; color: var(--muted); white-space: nowrap; }

  /* ── table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 680px; }
  th, td { text-align: left; padding: 11px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    font-size: .66rem; text-transform: uppercase; letter-spacing: .5px;
    color: var(--navy); background: var(--gold-light); font-weight: 800;
  }
  [data-theme="dark"] th { color: var(--gold); }
  tr:hover td { background: rgba(212,160,23,.05); }

  .badge { padding: 3px 9px; border-radius: 20px; font-size: .7rem; font-weight: 800; display: inline-block; }
  .badge.pending  { background: var(--pending-bg); color: var(--pending); }
  .badge.returned { background: var(--ok-bg);      color: var(--ok); }

  .actions { display: flex; flex-direction: column; gap: 8px; min-width: 210px; }
  .actions .return-inputs { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions .return-inputs input { flex: 1; min-width: 100px; padding: 8px 10px; font-size: .85rem; }
  .actions .action-btns { display: flex; gap: 6px; }
  .actions .action-btns button {
    flex: 1; padding: 9px 12px; font-size: .83rem; font-weight: 700; white-space: nowrap;
  }
  .btn-danger { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
  .btn-danger:hover { background: rgba(192,39,45,.08); }

  .remarks-input {
    width: 100%; min-width: 140px; padding: 7px 9px; font-size: .82rem;
    border: 1.5px solid transparent; border-radius: 6px; background: transparent; color: var(--text);
    resize: vertical; font-family: inherit;
  }
  .remarks-input:hover { border-color: var(--border); }
  .remarks-input:focus {
    outline: none; border-color: var(--gold); background: var(--card-bg);
    box-shadow: 0 0 0 3px rgba(212,160,23,.18);
  }
  .remarks-input::placeholder { color: var(--muted); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  /* ── toast ── */
  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px;
    background: var(--navy-dark); color: #fff; padding: 11px 18px; border-radius: 9px;
    font-size: .82rem; opacity: 0; transform: translateY(10px);
    transition: all .25s ease; pointer-events: none; max-width: 82vw;
    border-left: 4px solid var(--gold);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>

  <option value="James Marcelino">
  <option value="Mc Arana">
  <option value="Rondolf Reyes">
  <option value="Shawn Raiz">
</datalist>
      </div>
      <div>
        <label for="date_out">Date Out</label>
        <input type="date" id="date_out" required>
      </div>
      <div>
        <label for="borrower_name">Borrower Name</label>
        <input type="text" id="borrower_name" placeholder="Printed name" required>
      </div>
      <button type="submit" class="btn-primary">Add Entry</button>
    </form>
  </section>

  <section class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="card-title" style="border:none;padding:0;margin:0"><span class="dot"></span> Log Entries</div>
        <div class="filter-group">
          <label for="monthFilter">Filter by Month</label>
          <select id="monthFilter"><option value="">All months</option></select>
        </div>
        <span class="hint" id="countHint"></span>
      </div>
      <div class="toolbar-right">
        <button class="btn-ghost"  id="exportAllBtn">⬇ Export All</button>
        <button class="btn-gold"   id="exportMonthBtn">⬇ Export Filtered</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Qty</th><th>Item</th><th>Date Out</th><th>Borrower</th>
            <th>Status</th><th>Date In / Received By</th><th style="min-width:150px">Remarks</th><th style="min-width:220px">Actions</th>
          </tr>
        </thead>
        <tbody id="entriesBody">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ── keys ── */
const STORAGE_KEY      = 'ictBorrowersLog.entries.v1';
const CUSTOM_ITEMS_KEY = 'ictBorrowersLog.customItems.v1';
const THEME_KEY        = 'ictBorrowersLog.theme.v1';

/* ── ICT catalog ── */
const DEFAULT_ITEMS = [
  'Projector','Projector Screen','Conference Camera','Webcam',
  'Laptop','Laptop Charger','Desktop Monitor',
  'HDMI Cable','VGA Cable','USB-C Cable','Extension Cord','Power Strip',
  'Wireless Mouse','Wireless Keyboard','Presenter / Clicker',
  'Portable Speaker','Microphone','Wireless Microphone Set',
  'Tripod','Ring Light','External Hard Drive','USB Flash Drive',
  'Wi-Fi Router / Pocket Wi-Fi','Tablet','Document Camera / Visualizer',
  'Barcode Scanner','Label Printer','Portable Printer',
  'Video Switcher / Capture Card','Headset'
];

/* ── helpers ── */
const $  = id => document.getElementById(id);
const eh = str => String(str).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return isNaN(dt) ? d : dt.toLocaleDateString(undefined,
    { year:'numeric', month:'short', day:'numeric' });
}
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ── theme ── */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('themeIcon').textContent  = theme === 'dark' ? '☀️' : '🌙';
  $('themeLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
}
function initTheme() {
  let saved;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  if (!saved) {
    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme(saved);
}
$('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* ── entries storage ── */
function loadEntries() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function saveEntries(entries) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); return true; }
  catch { toast('Could not save — storage may be full.'); return false; }
}
function nextId(e) { return e.reduce((m, x) => Math.max(m, x.id), 0) + 1; }

/* ── custom items ── */
function loadCustomItems() {
  try { const r = localStorage.getItem(CUSTOM_ITEMS_KEY); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function saveCustomItem(name) {
  if (!name) return;
  const custom = loadCustomItems();
  const all = [...DEFAULT_ITEMS, ...custom];
  if (!all.some(i => i.toLowerCase() === name.toLowerCase())) {
    custom.push(name);
    try { localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify(custom)); } catch {}
  }
}
function populateItemOptions() {
  const dl = $('itemOptions');
  const items = [...DEFAULT_ITEMS, ...loadCustomItems()].sort((a,b) => a.localeCompare(b));
  dl.innerHTML = items.map(i => `<option value="${eh(i)}"></option>`).join('');
}

/* ── month filter ── */
const monthKey   = d  => d ? d.slice(0,7) : null;
const monthLabel = k  => {
  const [y,m] = k.split('-');
  return new Date(+y, +m-1, 1).toLocaleDateString(undefined, { year:'numeric', month:'long' });
};
function populateMonthFilter(all) {
  const sel  = $('monthFilter');
  const prev = sel.value;
  const keys = [...new Set(all.map(e => monthKey(e.date_out)).filter(Boolean))].sort().reverse();
  sel.innerHTML = '<option value="">All months</option>' +
    keys.map(k => `<option value="${k}">${monthLabel(k)}</option>`).join('');
  if (keys.includes(prev)) sel.value = prev;
}
function getFiltered() {
  const all = loadEntries().sort((a,b) => b.id - a.id);
  const m   = $('monthFilter').value;
  return m ? all.filter(e => monthKey(e.date_out) === m) : all;
}

/* ── render ── */
function render() {
  const all     = loadEntries();
  const entries = getFiltered();
  populateMonthFilter(all);
  const m = $('monthFilter').value;
  $('countHint').textContent = entries.length
    ? `${entries.length} entr${entries.length===1?'y':'ies'}${m?' · '+monthLabel(m):''}`
    : m ? `No entries for ${monthLabel(m)}` : '';

  const tbody = $('entriesBody');
  if (!entries.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">${
      m ? 'No entries for this month.' : 'No entries yet — log an item above.'
    }</td></tr>`;
    return;
  }
  tbody.innerHTML = entries.map(e => {
    const ret = !!e.date_in;
    return `<tr>
      <td>${e.qty}</td>
      <td>${eh(e.item_description)}</td>
      <td>${fmtDate(e.date_out)}</td>
      <td>${eh(e.borrower_name)}</td>
      <td>${ret ? '<span class="badge returned">✓ Returned</span>'
               : '<span class="badge pending">⏳ Out</span>'}</td>
      <td>${ret
        ? `${fmtDate(e.date_in)}<br><span style="color:var(--muted);font-size:.82rem">${eh(e.receiver_name||'')}</span>`
        : '—'}</td>
      <td>
        <textarea class="remarks-input" rows="2" data-id="${e.id}" placeholder="Add remark…">${eh(e.remarks||'')}</textarea>
      </td>
      <td>
        <div class="actions">
          ${!ret ? `<div class="return-inputs">
            <input type="date" id="date_in_${e.id}" value="${new Date().toISOString().slice(0,10)}">
            <input type="text" id="receiver_${e.id}" list="staffOptions" placeholder="Received by" autocomplete="off">
          </div>` : ''}
          <div class="action-btns">
            ${!ret ? `<button class="btn-return" data-action="return" data-id="${e.id}">✓ Mark Returned</button>` : ''}
            <button class="btn-danger" data-action="delete" data-id="${e.id}">🗑 Delete</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}


/* ── CSV ── */
function makeCSV(entries) {
  const h = ['Qty','Item Description','Date Out','Borrower Name','Date In','Received By','Remarks'];
  return [h, ...entries.sort((a,b)=>a.id-b.id).map(e=>[
    e.qty, e.item_description, e.date_out, e.borrower_name, e.date_in||'', e.receiver_name||'', e.remarks||''
  ])].map(r => r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
}

$('exportAllBtn').addEventListener('click', () => {
  const entries = loadEntries();
  if (!entries.length) { toast('Nothing to export yet.'); return; }
  const d = new Date().toISOString().slice(0,10);
  downloadBlob(makeCSV(entries), `nrcp-ict-log-all-${d}.csv`, 'text/csv;charset=utf-8;');
  toast(`Exported all ${entries.length} entries.`);
});
$('exportMonthBtn').addEventListener('click', () => {
  const entries = getFiltered();
  if (!entries.length) { toast('No entries to export.'); return; }
  const m = $('monthFilter').value || 'all';
  const d = new Date().toISOString().slice(0,10);
  downloadBlob(makeCSV(entries), `nrcp-ict-log-${m}-${d}.csv`, 'text/csv;charset=utf-8;');
  toast(`Exported ${entries.length} entr${entries.length===1?'y':'ies'}.`);
});

/* ── add entry ── */
$('entryForm').addEventListener('submit', e => {
  e.preventDefault();
  const qty              = Number($('qty').value) || 1;
  const item_description = $('item_description').value.trim();
  const date_out         = $('date_out').value;
  const borrower_name    = $('borrower_name').value.trim();
  if (!item_description || !date_out || !borrower_name) {
    toast('Please fill in item, date out, and borrower name.'); return;
  }
  const entries = loadEntries();
  entries.push({ id: nextId(entries), qty, item_description, date_out, borrower_name,
    date_in: null, receiver_name: null, remarks: '', created_at: new Date().toISOString() });
  if (saveEntries(entries)) {
    saveCustomItem(item_description);
    populateItemOptions();
    e.target.reset();
    $('qty').value      = 1;
    $('date_out').value = new Date().toISOString().slice(0,10);
    toast('Entry logged.');
    render();
  }
});

/* ── table actions ── */
$('entriesBody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = Number(btn.dataset.id), action = btn.dataset.action;
  if (action === 'delete') {
    if (!confirm('Delete this log entry?')) return;
    const entries = loadEntries().filter(en => en.id !== id);
    if (saveEntries(entries)) { toast('Entry deleted.'); render(); }
  }
  if (action === 'return') {
    const date_in       = $(`date_in_${id}`).value;
    const receiver_name = $(`receiver_${id}`).value.trim();
    if (!date_in || !receiver_name) { toast('Date in and receiver name required.'); return; }
    const entries = loadEntries();
    const entry   = entries.find(en => en.id === id);
    if (!entry) return;
    entry.date_in = date_in; entry.receiver_name = receiver_name;
    if (saveEntries(entries)) { toast('Marked as returned.'); render(); }
  }
});

/* ── remarks (save on blur / change, no full re-render so focus isn't lost) ── */
$('entriesBody').addEventListener('change', e => {
  const el = e.target.closest('.remarks-input');
  if (!el) return;
  const id = Number(el.dataset.id);
  const entries = loadEntries();
  const entry = entries.find(en => en.id === id);
  if (!entry) return;
  entry.remarks = el.value.trim();
  if (saveEntries(entries)) toast('Remark saved.');
});

$('monthFilter').addEventListener('change', render);

/* ── init ── */
initTheme();
$('date_out').value = new Date().toISOString().slice(0,10);
populateItemOptions();
render();
</script>
</body>
</html>
